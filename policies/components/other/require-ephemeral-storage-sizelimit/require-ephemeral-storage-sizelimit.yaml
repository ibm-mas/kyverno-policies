apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ibm-require-ephemeral-storage-sizelimit
  annotations:
    policies.kyverno.io/title: Require Ephemeral Storage sizeLimit
    policies.kyverno.io/category: IBM - Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.6.0
    policies.kyverno.io/description: >-
      Ephemeral storage volumes (emptyDir) can consume unbounded storage resources if not properly
      configured with a sizeLimit. This can lead to node disk pressure and potential pod evictions.
      This policy requires that all emptyDir volumes define a sizeLimit to ensure proper resource
      management and prevent storage exhaustion on cluster nodes.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-ephemeral-storage-sizelimit
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: ibm.com/kyverno
                    operator: Exists
      # Documentation shows that there is no way to define sizeLimit for the emptyDir created by builder:
      # https://docs.openshift.com/container-platform/latest/rest_api/workloads_apis/buildconfig-build-openshift-io-v1.html
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: "openshift.io/build.name"
                    operator: Exists
      validate:
        message: "All emptyDir volumes must define a sizeLimit to prevent unbounded storage consumption."
        deny:
          conditions:
            any:
              # We allow 'istio-envoy', 'istio-data', 'workload-socket', 'credential-socket' and 'workload-certs' to be unbounded volumes,
              # These are storage volumes created specifically for istio proxy containers and will only be present if Service Mesh/Istio has 
              # been installed and enabled in the MAS namespaces. The standard Istio sidecar container automatically defines these unbounded volumes
              # see https://github.com/istio/istio/blob/6085d1e7ee6f21d5689ea9b16a33fa809b25cec4/manifests/charts/istio-control/istio-discovery/files/injection-template.yaml#L476 
              - key: "{{ request.object.spec.volumes[?type(@) == 'object' && emptyDir != null && emptyDir.sizeLimit == null && !contains(['istio-envoy', 'istio-data', 'workload-socket', 'credential-socket', 'workload-certs'], name)] | length(@) }}"
                operator: GreaterThan
                value: 0
